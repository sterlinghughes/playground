[package]
name = "hello-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello-client"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-prost-build = "0.14"
