[package]
name = "hello-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello-server"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14"
